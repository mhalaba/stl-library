name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Raz w tygodniu, zeby wylapac regresje z nowych wersji zaleznosci.
    - cron: "0 5 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Dolna i gorna granica wspieranych wersji Pythona.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalacja zaleznosci
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Testy jednostkowe
        run: python tests/unit.py

      - name: Testy end-to-end
        run: python tests/e2e.py

      - name: Kontrola, czy sekrety nie trafily do repozytorium
        run: |
          # Klucz Ed25519 to 64 znaki hex; token GitHuba zaczyna sie od gho_/ghp_.
          if git grep -nIE "(gh[pousr]_[A-Za-z0-9]{20,}|STL_SIGNING_PRIVATE_KEY=[0-9a-f]{32,})" -- . ; then
            echo "::error::Znaleziono material, ktory wyglada na sekret."
            exit 1
          fi
          if git ls-files | grep -qE "^(\.env$|data/)"; then
            echo "::error::Plik .env albo katalog data/ trafil do repozytorium."
            exit 1
          fi
          echo "Czysto."
