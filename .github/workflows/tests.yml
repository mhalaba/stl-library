name: tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, to catch regressions coming from new dependency releases.
    - cron: "0 5 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower and upper bound of the supported Python range.
        python-version: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Unit tests
        run: python tests/unit.py

      - name: End-to-end tests
        run: python tests/e2e.py

      - name: Check that no secrets reached the repository
        run: |
          # An Ed25519 key is 64 hex characters; GitHub tokens start with gho_/ghp_.
          if git grep -nIE "(gh[pousr]_[A-Za-z0-9]{20,}|STL_SIGNING_PRIVATE_KEY=[0-9a-f]{32,})" -- . ; then
            echo "::error::Found material that looks like a secret."
            exit 1
          fi
          if git ls-files | grep -qE "^(\.env$|data/)"; then
            echo "::error::A .env file or the data/ directory reached the repository."
            exit 1
          fi
          echo "Clean."
